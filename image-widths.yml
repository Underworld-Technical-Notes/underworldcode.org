  Strong-Scaling-Gadi-solid--vs-Magnus-dashed--2.jpg: 430
  Strong-Scaling-Gadi-solid--vs-Magnus-dashed--256-3-Resolution-1-1.png: 430
  Weak-Scaling-Gadi-solid--vs-Magnus-dashed--1-1.png: 430
  Weak-Scaling-Gadi-solid--vs-Magnus-dashed--32-3-PerProc-1.png: 430

getting-started-with-pull-requests:
