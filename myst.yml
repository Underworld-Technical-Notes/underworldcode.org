version: 1

project:
  id: underworld-technical-notes
  title: Underworld Technical Notes
  description: >-
    Methods, implementation notes, benchmarks and worked examples from the
    Underworld geodynamics code.
  github: https://github.com/underworld-technical-notes/underworldcode.org
  license:
    content: CC-BY-4.0
    code: MIT
  open_access: true

  # Articles live at articles/<slug>/<slug>.md. MyST takes a page's URL from its
  # FILENAME, not its path, so each publishes at /<slug>/ -- the exact URL the 50
  # registered DOIs already resolve to. Renaming these files breaks those DOIs.
  # BEGIN GENERATED TOC
  toc:
    - file: index.md
    - file: articles/craton-formation-and-the-onset-of-plate-tectonics/craton-formation-and-the-onset-of-plate-tectonics.md
  # END GENERATED TOC

site:
  template: book-theme
  title: Underworld Technical Notes
  # BEGIN GENERATED NAV
  nav:
    - title: "About"
      children:
        - title: "About"
          url: /ugcomm
        - title: "Credits"
          url: /credits
        - title: "How to cite"
          url: /how-to-cite-underworld
    - title: "Underworld"
      children:
        - title: "Introduction to Underworld"
          url: /intro-to-underworld
        - title: "Run in the cloud"
          url: /auscope-cloud
        - title: "Model exchange"
          url: /underworld-model-exchange
        - title: "Publications using Underworld"
          url: /publications-using-uw
    - title: "Technical Notes"
      children:
        - title: "All notes"
          url: /notes
        - title: "Browse by topic"
          url: /topics
        - title: "Submit a note"
          url: /submit
  # END GENERATED NAV
  options:
    logo_text: Underworld Technical Notes
    # The bat-and-globe, which is what a reader recognises in a row of tabs.
    # MyST ships its own otherwise, so the site looked like a MyST demo. It
    # belongs under `options`, not beside `title` -- MyST says so, once per
    # page built, which is how a clean build went to 43 warnings.
    favicon: static/uwtn-favicon.ico
    # The landing page is generated as a feed by scripts/build_index.py and
    # styled by static/uwtn.css, which borrows the archival PDF's typography so
    # the two renditions read as one publication.
    style: static/uwtn.css
    hide_footer_links: true
    numbered_references: true
