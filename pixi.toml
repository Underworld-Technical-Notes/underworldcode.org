[workspace]
name = "underworld-technical-notes"
description = "Underworld Technical Notes — MyST sources, archival PDFs and migration tooling"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.11,<3.13"
mystmd = ">=1.6,<2"
typst = ">=0.13,<0.14"
nodejs = ">=20"
pytest = ">=8"
# MyST shells out to ImageMagick to turn a GIF into something Typst can place.
# Without it the PDF build reports "you must install imagemagick" and carries on
# WITHOUT the figure -- the free-surface note lost one that way, and a missing
# figure in an archival PDF is not something a reader can recover from.
imagemagick = ">=7"

[tasks]
# One documented entry point. CI runs exactly these.
new = "python3 scripts/new_article.py"

# Legacy migration only. New notes are authored from templates/article-template,
# where a figure, a badge and an inline image are stated rather than inferred.
# Skips articles that already exist: conversion is the first step of the
# migration, and re-running it over a finished article discards the merged
# original text and the rebuilt vector figures. `--force` overwrites, and then
# merge-originals and rebuild-figures have to be run again.
convert = "python3 scripts/ghost_to_myst.py"

# index.md is generated from article metadata and is gitignored, so it must be
# built before ANY myst invocation -- it is the project's root toc entry, and
# without it myst refuses to start.
index = { cmd = "python3 scripts/build_index.py", depends-on = ["pages"] }
pages = "python3 scripts/build_pages.py"

# `myst build --html` truncates slugs to 50 characters, MyST's own `style`
# option never loads the stylesheet, and PDFs are written beside the sources
# rather than into the site. Each post-step fixes one of those.
#
# It depends on build-pdf so the two run IN ORDER. Both mutate the article
# sources -- build-pdf strips the web-only banner and discussion block for the
# duration of the Typst run -- and pixi runs independent tasks concurrently. Run
# in parallel they raced: the HTML was built from banner-stripped sources, and
# the blocks were missing from the tree afterwards.
build-html = { cmd = "myst build --html && python3 scripts/fix_slugs.py && python3 scripts/inject_style.py && python3 scripts/stage_downloads.py && python3 scripts/inject_comments.py && python3 scripts/build_feed.py", depends-on = ["build-pdf"] }
# The banner belongs on the web, not on page one of an archival PDF. It is
# derived from the `banner:` front matter, so it can be taken out for the Typst
# build and put back after; both directions are idempotent.
build-pdf = { cmd = "python3 scripts/acknowledgement.py && python3 scripts/build_pdf.py", depends-on = ["index"] }
build = { depends-on = ["build-pdf", "build-html"] }

# The EDITING cycle: a local server with hot reload, showing notes at draft
# and review the way the preview site does. The preview site is the REVIEW
# cycle -- a link for other people, costing about three minutes a push, most of
# which is GitHub's own deployment. Use this one to write.
#
# index.md, notes.md and the topic pages are generated, and myst refuses to
# start without index.md, so the index has to be built first -- with the same
# flag, or the note you are writing is the one thing missing from the site.
index-preview = { cmd = "python3 scripts/build_index.py", depends-on = ["pages"], env = { UWTN_PREVIEW = "1" } }
start = { cmd = "myst start", depends-on = ["index-preview"], env = { UWTN_PREVIEW = "1" } }

validate = "python3 scripts/validate_metadata.py"

# Deposit. Dry run by default and on every path that is not spelled out: the
# command refuses --publish without --live, and the workflow makes each step a
# separate deliberate choice. `package` is provider-neutral and needs no token.
package = "python3 scripts/archive_package.py"
deposit = "python3 scripts/deposit.py"
test-dois = "python3 scripts/test_doi_urls.py"
test-assets = "python3 scripts/check_build_assets.py"
test-links = "python3 scripts/check_links.py"
test-unit = "pytest -q tests/"
test = { depends-on = ["test-unit", "validate", "test-dois", "test-assets"] }

# Stage 0 migration tooling. Read-only against the live Ghost site.
inventory = "python3 scripts/inventory_site.py"
audit = "python3 scripts/audit_content.py"

# The recent posts were drafted in the underworld3 repo. compare-originals says
# how far each drafted copy has drifted from what Ghost actually published;
# rebuild-figures replaces rasterised figures with vector ones built from their
# Typst sources and the data that generates them.
# All read the preserved copy in sources/, not a live worktree.
compare-originals = "python3 scripts/compare_originals.py --repo ."
rebuild-figures = "python3 scripts/rebuild_figures.py --repo ."
merge-originals = "python3 scripts/merge_originals.py"
audit-math = "python3 scripts/audit_math.py --repo ."

# Reproduces the counts behind vocabulary.yml. Re-run it as the corpus grows:
# the scheme is meant to be revised, not defended.
vocabulary = "python3 scripts/analyse_vocabulary.py"

# Full migration pipeline, in order. Each step is reviewable on its own.
migrate = { depends-on = ["convert", "rebuild-figures", "merge-originals"] }
mirror = "python3 scripts/fetch_assets.py"
