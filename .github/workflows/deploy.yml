name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      # A project site is served under /<repo>/, so MyST has to be told at build
      # time or every root-relative asset 404s. Once a CNAME file exists the
      # site is served at the root of its own domain and the prefix must go --
      # deriving it from the CNAME means it cannot be left wrong at cutover.
      - name: Determine base URL
        id: base
        run: |
          if [ -f CNAME ]; then
            echo "Custom domain $(cat CNAME) — building at the site root"
            echo "base_url=" >> "$GITHUB_OUTPUT"
          else
            echo "No CNAME — building for the project-site subpath"
            echo "base_url=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          BASE_URL: ${{ steps.base.outputs.base_url }}
        run: pixi run build

      # Never publish a build that would break a registered DOI.
      - name: No registered DOI is broken
        run: pixi run test-dois

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - id: deployment
        uses: actions/deploy-pages@v4
