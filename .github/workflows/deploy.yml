name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub's starter workflow keeps queued deploys, on the reasoning that an
# in-flight production deployment should not be interrupted. That assumes
# infrequent pushes: here, successive commits queued behind each other until
# the Pages queue outlasted the action's patience and runs failed on a timeout
# while the site itself deployed fine. Only the newest commit should be live,
# so superseded runs are cancelled instead.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      # A project site is served under /<repo>/, so MyST has to be told at build
      # time or every root-relative asset 404s. Once a CNAME file exists the
      # site is served at the root of its own domain and the prefix must go --
      # deriving it from the CNAME means it cannot be left wrong at cutover.
      - name: Determine base URL
        id: base
        run: |
          if [ -f CNAME ]; then
            echo "Custom domain $(cat CNAME) — building at the site root"
            echo "base_url=" >> "$GITHUB_OUTPUT"
          else
            echo "No CNAME — building for the project-site subpath"
            echo "base_url=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          BASE_URL: ${{ steps.base.outputs.base_url }}
        run: pixi run build

      # Never publish a build that would break a registered DOI.
      - name: No registered DOI is broken
        run: pixi run test-dois

      - name: Referenced assets exist
        env:
          BASE_URL: ${{ steps.base.outputs.base_url }}
        run: pixi run test-assets --base-url "$BASE_URL"

      # The artifact IS the site. The CNAME at the repo root decides the base
      # URL above, but it is not part of _build/html, so without this it never
      # reaches the server -- and a Pages deployment whose artifact carries no
      # CNAME can drop the custom domain that was set in the settings. The one
      # file the whole cutover turns on, left out of the only directory that
      # gets published.
      - name: Carry the custom domain into the artifact
        if: hashFiles('CNAME') != ''
        run: cp CNAME _build/html/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      # GitHub's Pages queue intermittently keeps a deployment pending for
      # longer than the action's default patience, which fails the run with a
      # timeout that has nothing to do with the build.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 600000 ms is the action's hard maximum; larger values are clamped.
          timeout: 600000
