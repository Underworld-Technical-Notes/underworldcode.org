name: deposit

# Depositing runs HERE and not on a pull request, and that is not a preference.
# GitHub does not expose secrets to workflows triggered by a pull request from a
# fork, and notes are submitted by pull request. So the token is only available
# on a manual run or after a merge -- which happens to match the editorial
# model, where a deposit follows acceptance rather than submission, and which is
# what stops a stray pull request from minting a DOI.
#
# Manual only. There is no push trigger: minting an identifier is an editorial
# act, and it should take a person deciding to do it.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Article slug; leave empty with mode=deposit-all"
        required: false
      mode:
        description: "What to do"
        required: true
        default: dry-run
        type: choice
        options:
          # Nothing leaves the runner. Prints what would be sent and builds the
          # package, so the whole thing can be read before anything exists.
          - dry-run
          # Creates a draft and reserves a DOI. Reversible: the draft can be
          # deleted and the reservation goes with it.
          - reserve
          # Updates the metadata and uploads the package to the existing draft.
          # Still reversible -- files can be replaced, the draft deleted.
          - upload
          # The one irreversible step. A published DOI is a citation somebody
          # may already have used.
          - publish
          # Throws the draft away and clears it from metadata.yml.
          - delete-draft
          # A new version of records that are already published, carrying
          # whatever the notes have picked up since. Also irreversible, but far
          # less consequential than the first publish: the concept DOI keeps
          # resolving, now to the newer copy, so nothing already cited breaks.
          # With a slug, that one note; without, every published record.
          - new-version
          # Every archival note without a record yet, oldest first: reserve,
          # rebuild the PDF so the DOI is on it, upload, publish. One article at
          # a time, and a failure STOPS the run -- each of these mints an
          # identifier, and a loop that shrugs off an error and carries on is
          # how you end up with records nobody can account for.
          - deposit-all

# One deposit at a time. Two concurrent runs for the same article could each
# create a draft, and the second would reserve a second DOI for one note.
concurrency:
  group: deposit
  cancel-in-progress: false

jobs:
  deposit:
    runs-on: ubuntu-latest
    # The identifiers are committed back, and the default token is read-only.
    # Without this the deposit succeeds and the record id never reaches the
    # repository -- which is precisely the state the duplicate-mint guard needs
    # to avoid.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      # The DOI has to be on the PDF's title page, so the PDF is built here
      # rather than trusted from the repository -- and after `reserve` has
      # written the DOI into metadata.yml, this is what puts it on the paper.
      - name: Build the site and the archival PDFs
        run: pixi run build

      - name: Confirm the deposit is safe to make
        run: pixi run validate

      - name: Dry run
        if: inputs.mode == 'dry-run'
        run: pixi run deposit -- --slug "${{ inputs.slug }}"

      - name: Create the draft and reserve the DOI
        if: inputs.mode == 'reserve'
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: pixi run deposit -- --slug "${{ inputs.slug }}" --live

      - name: Upload the package
        if: inputs.mode == 'upload'
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: pixi run deposit -- --slug "${{ inputs.slug }}" --live

      - name: Publish
        if: inputs.mode == 'publish'
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: pixi run deposit -- --slug "${{ inputs.slug }}" --live --publish

      - name: Deposit and publish everything outstanding
        if: inputs.mode == 'deposit-all'
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: pixi run deposit -- --all --live --publish

      # No --slug is deliberate when the input is empty: the batch path stamps
      # every published note, builds once, and uploads. Passing an empty --slug
      # would look like one article and find none.
      - name: Publish a new version
        if: inputs.mode == 'new-version'
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            pixi run deposit -- --slug "${{ inputs.slug }}" --live --new-version
          else
            pixi run deposit -- --live --new-version
          fi

      - name: Delete the draft
        if: inputs.mode == 'delete-draft'
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
        run: pixi run deposit -- --slug "${{ inputs.slug }}" --live --delete-draft

      # The record id and the DOI are written into metadata.yml as they are
      # obtained, so a run that dies partway can resume instead of reserving a
      # second identifier. That only helps if the change gets back to the
      # repository, so it is committed here rather than left on the runner.
      # A PULL REQUEST, not a push. `main` requires one, so the push was
      # rejected -- after the DOI had been minted and the record published.
      # That is the worst state this design has: a published identifier the
      # repository does not know about, so the guard against minting a SECOND
      # one for the same note has nothing to check.
      #
      # always(): a run that dies partway has usually already created a draft
      # and reserved a DOI, and that must reach the repository even so.
      - name: Open a pull request with the identifiers
        if: always() && inputs.mode != 'dry-run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- articles; then
            echo "no identifier changes to record"
            exit 0
          fi
          BRANCH="deposit/identifiers-${GITHUB_RUN_ID}"
          git config user.name "underworld-technical-notes"
          git config user.email "help@underworldcode.org"
          git checkout -b "$BRANCH"
          git add articles
          git commit -m "Record the deposit identifiers${{ inputs.slug && format(' for {0}', inputs.slug) || '' }}

          Written by the deposit workflow (${{ inputs.mode }}). The record id is
          the guard against ever minting a second DOI for these notes, so this
          has to reach the repository even if the run failed."
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Deposit identifiers from run ${GITHUB_RUN_ID}" \
            --body "DOIs and record ids written by the deposit workflow (\`${{ inputs.mode }}\`).

          **Merge this.** Until it lands, the repository does not know these records exist, and the guard against minting a second DOI for the same note has nothing to check.

          Underworld development team with AI support from [Claude Code](https://claude.com/claude-code)"

      - name: The package that was built
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deposit-${{ inputs.slug }}
          path: dist/*.zip
          if-no-files-found: ignore
