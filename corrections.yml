# Declared corrections applied during Ghost -> MyST conversion.
#
# The migration policy is "convert all, re-edit none": the articles keep their
# original text. These are not edits to the prose -- they are defects that
# break the build or resolve to nothing, fixed here rather than by hand so that
# every change is declared, reviewable and reproducible. The converter reports
# each one it applies; if a correction stops matching, it says so rather than
# passing silently.
#
# Format:
#   <slug>:
#     - find: <exact substring in the Ghost HTML>
#       replace: <replacement>
#       why: <one line>

underworld3-published-in-journal-of-open-source-software:
  - find: "https://doi.org/10.21105/joss.07831."
    replace: "https://doi.org/10.21105/joss.07831"
    why: >-
      Trailing full stop captured into the URL, so the DOI 404s at doi.org.
      MyST also fails to resolve it as a citation, which breaks the PDF build.
      This is Underworld3's own JOSS citation.

ismip-hom-benchmark-experiments-using-underworld:
  - find: "https://doi.org/10.5194/gmd-15-8749-2022,%202022."
    replace: "https://doi.org/10.5194/gmd-15-8749-2022"
    why: >-
      Trailing ", 2022." captured into the URL, so the DOI 404s at doi.org.
      (Article not yet migrated; correction recorded for when it is.)

adding-zotero-references-to-a-webpage:
  - find: groups/<strong>2386948</strong>/
    replace: groups/<code>2386948</code>/
    why: >-
      The article bolds two fragments of a URL to point them out, and both break
      the Typst export. This one renders as */ -- the END of a block comment,
      with no beginning -- and the next as /*, its start. Marked up as code
      instead, which is what an opaque identifier is, and which reads the same.
  - find: collectionKey/<strong>QNARWBUC.</strong>
    replace: collectionKey/<code>QNARWBUC</code>.
    why: >-
      The second of the two. See above.

viscoelasticity:
  - find: <p>A uniform visc</p><p>oelastic material
    replace: <p>A uniform viscoelastic material
    why: >-
      The Ghost import split a word across two paragraphs, so the article reads
      "A uniform visc" and then, after a paragraph break, "oelastic material
      undergoes simple shear". The pre-Ghost site has the sentence intact --
      see underworldcode.github.io.retired,
      _posts/2016-06-24-ViscoelasticityInUnderworld2.md -- so this restores what
      was published rather than guessing at it.
