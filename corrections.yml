how-many-processors-should-we-use-to-solve-problem-x:
  - find: $u(x,y,z)=sin(\pi x)sin(\pi y) sin (\pi z)$
    replace: $u(x,y,z)=\sin(\pi x)\sin(\pi y)\sin(\pi z)$
    why: >-
      sin set as three italic variables multiplied together, which is what LaTeX
      does with a bare "sin". \sin sets it upright as the operator it is.
