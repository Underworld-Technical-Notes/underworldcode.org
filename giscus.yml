# Comments, via Giscus — GitHub Discussions rendered in the page.
#
# The Giscus GitHub App is installed on this repository (verified: the API
# answers "Discussion not found" rather than "giscus is not installed", which
# is the state before a thread's first comment -- Giscus creates each thread
# when someone first comments).
#
# Set `enabled: false` to fall back to a plain link to Discussions.
#
# Delivered as Giscus's **iframe widget**, not its <script> tag. Two findings
# behind that, both established rather than assumed:
#
#   * MyST strips <script> from page content and from theme parts alike.
#   * Injecting it into the built HTML afterwards does not work either. The
#     theme's client entry calls `hydrateRoot(document, ...)` -- React owns the
#     whole document, not a root div -- so anything added to the built page is
#     reconciled away at hydration. That is also why an inlined stylesheet in
#     <head> disappeared and had to be declared through `site.options.style`.
#
# MyST does pass <iframe> through, so the widget embeds without any script on
# our origin. The trade-off is that Giscus's auto-resize needs its script's
# postMessage listener, so the frame has a fixed height and scrolls internally.

enabled: false

repo: Underworld-Technical-Notes/underworldcode.org
repo_id: R_kgDOTvdKWg
category: Announcements          # only maintainers can open a thread
category_id: DIC_kwDOTvdKWs4DC1FQ

# `specific` with the article slug as the term, rather than `pathname`: the
# staging site is served under /underworldcode.org/ and the production site
# will not be, and a mapping that changes at cutover would orphan every thread.
# The page each thread belongs to. Giscus needs this to send a reader back
# after signing in with GitHub; without it the widget loads but offers no way
# to comment. It changes at cutover, alongside the CNAME.
site_url: https://underworld-technical-notes.github.io/underworldcode.org

mapping: specific
reactions_enabled: false
theme: preferred_color_scheme
height: 520
