# Everything Giscus needs, recorded so embedding it later is configuration
# rather than archaeology.
#
# It is not embedded today. Giscus is delivered as a <script> tag, and MyST
# strips <script> from page content *and* from theme parts -- verified for
# both -- so the official embed cannot be placed without forking book-theme or
# injecting it after the build, where the theme's React hydration is liable to
# discard it. Article pages instead carry a plain link to open a Discussion,
# which keeps the conversation on GitHub just the same and needs no script.
#
# The site currently loads no third-party JavaScript at all. The Ghost site
# loaded eight such scripts, including one from a service Oracle shut down in
# 2023. That is worth weighing before adding one back.

repo: Underworld-Technical-Notes/underworldcode.org
repo_id: R_kgDOTvdKWg
category: Announcements          # only maintainers can open a thread
category_id: DIC_kwDOTvdKWs4DC1FQ
mapping: pathname
reactions_enabled: true
theme: preferred_color_scheme
