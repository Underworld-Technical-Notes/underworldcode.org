# Author registry for Underworld Technical Notes.
#
# Collected once here rather than repeated per article. ORCIDs matter more than
# they look: a deposit carrying an author's ORCID propagates into that author's
# ORCID record automatically, so an author without one has to be added by hand
# afterwards, for every note.
#
# The ORCIDs below are transcribed from the Underworld3 JOSS paper
# (`publications/joss-paper/paper.md` in the underworld3 repository), which is
# the publication of record. Every check digit has been verified --
# `scripts/validate_metadata.py` computes the ORCID mod-11-2 checksum, so a
# transcription error fails the build rather than attributing someone's work to
# a stranger.
#
# Still null: ask the person. Never guess, and never copy from a search result.
#
# Affiliations are as given in the JOSS paper (2024) and are not tracked over
# time. They are a convenience for the record's metadata, not a claim about
# where someone works today.

