# Author registry for Underworld Technical Notes.
#
# Ghost stores no ORCIDs (Louis's happens to sit in the author "website" field;
# nobody else has one recorded). DOI-bearing articles should carry ORCIDs, so
# they are collected here once rather than repeated per article.
#
# ORCIDs are left null rather than guessed: attaching a wrong ORCID attributes
# someone's work to a stranger. Fill these in from the people themselves.
# `scripts/validate_metadata.py` warns about nulls on DOI-bearing articles and
# rejects anything that is present but malformed.

