  # `no_orcid: true` means asked, and there is none -- as against `orcid: null`
  # below, which means not yet looked up. The validator warns about the second
  # and not the first, so the reminder stays on the authors who could still
  # supply one. A deposit for an author with no ORCID will not propagate into an
  # ORCID record automatically; that is the cost, and it is theirs to weigh.
  adam:
    name: Adam Beall
    orcid: null
    no_orcid: true
    affiliation: null

  haibin:
    name: Haibin Yang
    orcid: 0000-0002-8628-3704
    affiliation: null

  # No ORCID, and unlikely to acquire one -- the identifier follows from
  # publishing, and this author has not. Recorded so the question is closed
  # rather than re-asked at every deposit.
  rohan:
    name: Rohan Byrne
    orcid: null
    no_orcid: true
    affiliation: null
